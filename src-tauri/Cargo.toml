[package]
name = "myreader"
version = "0.1.0"
description = "只读的 macOS Markdown 阅读器"
edition = "2021"

[lib]
name = "myreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 需求指定解析器。关掉默认特性（CLI 依赖与 onig C 库），只保留核心解析/渲染。
comrak = { version = "0.56", default-features = false }
# HTML 白名单净化（安全硬要求），基于 html5ever 的标准 sanitizer。
ammonia = "4.2"
# 系统文件打开对话框（Cmd+O，需求「打开文件」）。
tauri-plugin-dialog = "2.8"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
