[package]
name = "myreader"
version = "0.1.0"
description = "只读的跨平台（macOS / Windows）Markdown 阅读器"
edition = "2021"

[lib]
name = "myreader_lib"
# 仅桌面端（macOS / Windows）构建：默认的 rlib 已足够被 main.rs 链接。
# staticlib / cdylib 是移动端打包才需要的产物；开启调试信息时 staticlib 单个
# 文件约 350 MB，是开发期 target/ 体积膨胀的主因之一（见 size-budget.json）。

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 只读图片文件头解析像素尺寸（本地图片确定性占位，SPEC §9.3 第 5 项）。
imagesize = "0.15"
# 需求指定解析器。关掉默认特性（CLI 依赖与 onig C 库），只保留核心解析/渲染。
# syntect-fancy 使用纯 Rust 正则（避免 onig C 依赖）。
comrak = { version = "0.56", default-features = false, features = ["syntect-fancy"] }
# 需求指定代码高亮；只用内置主题/语法集与 HTML 类名生成（class-based）。
syntect = { version = "5.3", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "html",
] }
# HTML 白名单净化（安全硬要求），基于 html5ever 的标准 sanitizer。
ammonia = "4.2"
# 系统文件打开对话框（Cmd+O，需求「打开文件」）。
tauri-plugin-dialog = "2.8"
# 用系统默认浏览器打开外链（不在应用内导航，需求「链接」）。
tauri-plugin-opener = "2.7"
# 需求指定状态持久化：主题偏好/字号/滚动位置/最近文件（Rust 侧读写）。
tauri-plugin-store = "2.5"
# 窗口大小/位置记忆：多显示器、缩放、最大化等边界由插件处理，手写易错。
tauri-plugin-window-state = "2.5"
# Windows 文件关联双击会启动新进程；单实例插件把参数转发给已经运行的窗口。
tauri-plugin-single-instance = "2"
# Windows 的 std::fs::canonicalize 返回 `\\?\C:\...` 前缀路径；dunce 在可能时
# 去掉该前缀，避免污染窗口标题、最近文件 key 与 asset 协议 URL。
dunce = "1"

[profile.dev]
incremental = true
# 完整调试信息（未配置时 debug 默认 true）是开发期 target/debug 体积的最大来源
# （修复前本机实测约 2.5 GiB）。本 crate 保留行号表：panic 栈仍有「文件:行号」。
debug = "line-tables-only"

# 依赖占 target/debug 的绝大部分，其调试信息在应用排障中很少用到；全部关闭。
# 需要单步调试第三方库时，把本表临时改成 debug = 2 后重建即可。
[profile.dev.package."*"]
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
