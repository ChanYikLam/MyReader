<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyReader</title>
    <!--
      首帧防闪（SPEC §9.2）：
      1) 主题内联同步脚本：window.__BOOT__ 由 Rust initialization_script 在页面
         任何脚本之前注入，这里同步给 <html> 打上 data-theme，再加载任何 CSS/JS。
      2) 关键布局 CSS 内联，保证第一帧就是正确的主题背景与排版基础。
    -->
    <script>
      (function () {
        var boot = window.__BOOT__ || {};
        var mode = boot.themeMode || "system";
        var dark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        root.dataset.themeMode = mode;
        root.style.colorScheme = dark ? "dark" : "light";
        if (typeof boot.fontSize === "number") {
          root.style.setProperty("--content-font-size", boot.fontSize + "px");
        }
        // 侧栏：用户手动设置优先；否则宽窗口默认展开（SPEC §18 A3）。
        var sidebarOpen = boot.sidebarOpen;
        if (typeof sidebarOpen !== "boolean") {
          sidebarOpen = window.innerWidth >= 900;
        }
        root.dataset.sidebar = sidebarOpen ? "open" : "closed";
      })();
    </script>
    <style>
      :root {
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
        --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo,
          Consolas, "Microsoft YaHei", monospace;
        --content-font-size: 17px;
        --content-width: 760px;
        /* 代码高亮主题变量默认值；注入的高亮 CSS 会按 data-theme 覆盖 */
        --code-bg: var(--bg-muted);
        --code-fg: var(--fg);
      }
      html[data-theme="light"] {
        color-scheme: light;
        --bg: #ffffff;
        --bg-muted: #f6f8fa;
        --fg: #1f2328;
        --fg-muted: #59636e;
        --border: #d1d9e0;
        --link: #0969da;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0d1117;
        --bg-muted: #161b22;
        --fg: #e6edf3;
        --fg-muted: #8d96a0;
        --border: #30363d;
        --link: #4493f8;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: auto;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
        font-size: var(--content-font-size);
        line-height: 1.75;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      /* 阅读布局骨架：侧栏 + 正文（首帧关键 CSS，内联避免 FOUC） */
      .app-shell {
        display: flex;
        align-items: flex-start;
        min-height: 100%;
      }
      .sidebar {
        position: sticky;
        top: 0;
        flex: 0 0 260px;
        height: 100vh;
        padding: 56px 14px 40px;
        overflow-y: auto;
        background: var(--bg);
        border-right: 1px solid var(--border);
      }
      html[data-sidebar="closed"] .sidebar {
        display: none;
      }
      .content-root {
        flex: 1 1 auto;
        min-width: 0;
        max-width: var(--content-width);
        margin: 0 auto;
        padding: 56px 40px 120px;
      }
      /* 深浅模式切换按钮（固定右上角，首帧即可见） */
      .theme-toggle {
        position: fixed;
        top: 16px;
        right: 14px;
        z-index: 12;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        padding: 0;
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1;
        color: var(--fg-muted);
        cursor: pointer;
        background: var(--bg-muted);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .theme-toggle:hover {
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-shell">
      <main class="content-root" id="content-root">
        <p class="boot-status" id="boot-status">正在启动…</p>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
