<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyReader</title>
    <!--
      首帧防闪（SPEC §9.2）：
      1) 主题内联同步脚本：window.__BOOT__ 由 Rust initialization_script 在页面
         任何脚本之前注入，这里同步给 <html> 打上 data-theme，再加载任何 CSS/JS。
      2) 关键布局 CSS 内联，保证第一帧就是正确的主题背景与排版基础。
    -->
    <script>
      (function () {
        var boot = window.__BOOT__ || {};
        var mode = boot.themeMode || "system";
        var dark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        root.dataset.themeMode = mode;
        root.style.colorScheme = dark ? "dark" : "light";
        if (typeof boot.fontSize === "number") {
          root.style.setProperty("--content-font-size", boot.fontSize + "px");
        }
      })();
    </script>
    <style>
      :root {
        --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Hiragino Sans GB", "Helvetica Neue", sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --content-font-size: 17px;
        --content-width: 760px;
        /* 代码高亮主题变量默认值；注入的高亮 CSS 会按 data-theme 覆盖 */
        --code-bg: var(--bg-muted);
        --code-fg: var(--fg);
      }
      html[data-theme="light"] {
        color-scheme: light;
        --bg: #ffffff;
        --bg-muted: #f6f8fa;
        --fg: #1f2328;
        --fg-muted: #59636e;
        --border: #d1d9e0;
        --link: #0969da;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0d1117;
        --bg-muted: #161b22;
        --fg: #e6edf3;
        --fg-muted: #8d96a0;
        --border: #30363d;
        --link: #4493f8;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
        font-size: var(--content-font-size);
        line-height: 1.75;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app-shell">
      <main class="content-root" id="content-root">
        <p class="boot-status" id="boot-status">正在启动…</p>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
